<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>Aula 10 - Blazor WebAssembly</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <!-- Tema claro/escuro conforme a preferência do sistema (Bootstrap 5.3: data-bs-theme). Roda antes do CSS para não piscar. -->
    <script>
        (function () {
            var escuro = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
            function aplicar() { document.documentElement.setAttribute('data-bs-theme', escuro && escuro.matches ? 'dark' : 'light'); }
            aplicar();
            if (escuro && escuro.addEventListener) escuro.addEventListener('change', aplicar);
        })();
    </script>
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Aula10.BlazorWasm.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        Ocorreu um erro inesperado.
        <a href="." class="reload">Recarregar</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>
</body>

</html>
